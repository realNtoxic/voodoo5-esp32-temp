; PlatformIO Projekt-Konfiguration — ESP32 Thermal-Monitor Voodoo 5 5500
; https://docs.platformio.org/page/projectconf.html

[env]
; Projekt-Root im Include-Pfad, damit lib/ und test/ #include "config.h" finden.
build_flags = -I.

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; Eigenstaendiger Display-Bring-up-Test (tools/display_test/), siehe
; CLAUDE.md. Eigener src_dir statt Default "src/" -- damit baut diese
; Umgebung NUR tools/display_test/ und laesst src/main.cpp (env:esp32)
; unberuehrt. Kein build_flags-Erbe von [env] (kein -I. noetig, das
; Tool ist bewusst eigenstaendig ohne config.h/Hal-Abhaengigkeit).
[env:disptest]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = tools/display_test
build_flags =
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
