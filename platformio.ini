; PlatformIO Projekt-Konfiguration — ESP32 Thermal-Monitor Voodoo 5 5500
; https://docs.platformio.org/page/projectconf.html

[env]
; Projekt-Root im Include-Pfad, damit lib/ und test/ #include "config.h" finden.
build_flags = -I.

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
