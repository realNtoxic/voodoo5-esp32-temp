; PlatformIO Projekt-Konfiguration — ESP32 Thermal-Monitor Voodoo 5 5500
; https://docs.platformio.org/page/projectconf.html

[env]
; Projekt-Root im Include-Pfad, damit lib/ und test/ #include "config.h" finden.
build_flags = -I.

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; Der Display-Bring-up-Test lebt bewusst NICHT als weitere Environment
; hier, siehe tools/display_test/platformio.ini: Der erste Versuch mit
; "src_dir"/"build_src_filter" direkt in dieser Datei schlug auf
; echter Hardware zweimal fehl (src/main.cpp landete trotzdem im
; disptest-Build) -- vermutlich ein nie geleerter .pio-Cache, siehe
; dortige Historie. Um das Risiko nicht zu wiederholen, blieb
; disptest als eigenes PlatformIO-Projekt (eigene platformio.ini,
; eigenes src/):
;   cd tools/display_test && pio run -t upload
;
; Fuer den LED-Test soll "pio run -e ledtest -t upload" zusaetzlich
; direkt aus dem Projekt-Root funktionieren. Verifiziert (siehe
; platformio/fs.py match_src_files()): "+<../tools/led_test/src/*>"
; wird nicht als Text behandelt, sondern ganz normal per os.path.join+
; glob aufgeloest und findet Dateien ausserhalb von src/ zuverlaessig.
[env:ledtest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../tools/led_test/src/*>
build_flags =
    -std=gnu++17

; tools/led_test/platformio.ini bleibt zusaetzlich als eigenstaendiges
; Projekt bestehen (Fallback, falls sich auf echter Hardware doch noch
; ein Cache-Problem zeigt):
;   cd tools/led_test && pio run -t upload
