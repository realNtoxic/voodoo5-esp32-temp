; PlatformIO Projekt-Konfiguration — ESP32 Thermal-Monitor Voodoo 5 5500
; https://docs.platformio.org/page/projectconf.html

[env]
; Projekt-Root im Include-Pfad, damit lib/ und test/ #include "config.h" finden.
build_flags = -I.

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

; Bring-up-Tests (Display, LED, Sensor, Sensor+Fan): zusaetzlich zu den
; eigenstaendigen Projekten unter tools/*/ (siehe dortige
; platformio.ini, Fallback via "cd tools/xxx && pio run -t upload")
; auch hier als Environment, damit "pio run -e <name> -t upload" direkt
; aus dem Projekt-Root funktioniert, konsistent mit env:esp32/
; env:native. "src_dir" ist dafuer NICHT geeignet (kein gueltiges
; Env-Feld, wird von PlatformIO stillschweigend ignoriert). Stattdessen
; build_src_filter mit einem "../"-Pfad -- verifiziert direkt gegen
; platformio.fs.match_src_files() mit den echten Projektpfaden: der
; Pattern-Matcher aufloest "../tools/<x>/src/*" ganz normal per
; os.path.join()+glob(), kein Sandboxing gegen Verzeichnisse ausserhalb
; von src/. env:esp32s eigener Default-Filter bleibt davon unberuehrt
; (weiterhin ausschliesslich src/main.cpp).
[env:disptest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../tools/display_test/src/*>
build_flags =
    -std=gnu++17
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

[env:ledtest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../tools/led_test/src/*>
build_flags =
    -std=gnu++17
lib_deps =
    adafruit/Adafruit NeoPixel

[env:sensortest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../tools/sensor_test/src/*>
build_flags =
    -std=gnu++17
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

[env:fantest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../tools/fan_test/src/*>
build_flags =
    -std=gnu++17
lib_deps =
    paulstoffregen/OneWire
