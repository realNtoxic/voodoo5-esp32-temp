; Eigenstaendiges PlatformIO-Projekt fuer den Sensor+Fan-Bring-up-Test
; (siehe CLAUDE.md). Analog zu tools/display_test/, tools/led_test/ und
; tools/sensor_test/: eigene platformio.ini, eigenes src/ -- Fallback,
; falls das zusaetzliche Root-Environment (siehe Haupt-platformio.ini,
; [env:fantest]) auf einem bestimmten Setup doch mal zickt.
;
; Bauen/Flashen (aus diesem Verzeichnis heraus):
;   cd tools/fan_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:fantest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
