; Eigenstaendiges PlatformIO-Projekt fuer den DS18B20-Bring-up-Test
; (siehe CLAUDE.md). Analog zu tools/display_test/ und tools/led_test/:
; eigene platformio.ini, eigenes src/ -- NICHT als zusaetzliche
; Environment in der Haupt-platformio.ini mit build_src_filter, weil
; genau das bei tools/display_test/ zweimal auf echter Hardware
; fehlgeschlagen ist (src/main.cpp der Hauptfirmware landete trotzdem
; im Build). Als eigenes Projekt gibt es diese Interferenz nicht.
;
; Bauen/Flashen (aus diesem Verzeichnis heraus):
;   cd tools/sensor_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:sensortest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
