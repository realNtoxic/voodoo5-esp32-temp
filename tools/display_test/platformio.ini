; Eigenstaendiges PlatformIO-Projekt fuer den Display-Bring-up-Test
; (siehe CLAUDE.md). Bewusst NICHT als zusaetzliche Environment in der
; Haupt-platformio.ini, weil sich "src_dir"/"build_src_filter" dort
; nicht zuverlaessig auf ein Verzeichnis ausserhalb von src/ umbiegen
; liessen -- src/main.cpp der Hauptfirmware landete trotzdem im Build.
; Als eigenes Projekt mit eigenem src/ gibt es diese Interferenz gar
; nicht erst: main.cpp hier ist vollstaendig unabhaengig von der
; Hauptfirmware (kein config.h/Hal/IDisplay-Include).
;
; Bauen/Flashen (aus diesem Verzeichnis heraus):
;   cd tools/display_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:disptest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
