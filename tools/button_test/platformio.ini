; Eigenstaendiges PlatformIO-Projekt fuer den Taster-Bring-up-Test
; (Ack-Taster, siehe CLAUDE.md Abschnitt "Ack-Taster"). Gleiches
; Prinzip wie tools/display_test/, tools/led_test/: eigene
; platformio.ini, eigenes src/ -- damit gibt es keine Interferenz mit
; env:esp32/env:native der Hauptfirmware (siehe dortige Historie:
; "src_dir"/"build_src_filter" liessen sich in EINER platformio.ini
; nicht zuverlaessig auf ein Verzeichnis ausserhalb von src/ umbiegen).
;
; Bauen/Flashen (aus diesem Verzeichnis heraus):
;   cd tools/button_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:buttontest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
