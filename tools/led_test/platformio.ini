; Eigenstaendiges PlatformIO-Projekt fuer den LED-Bring-up-Test
; (siehe CLAUDE.md Abschnitt "LED"). Gleiches Prinzip wie
; tools/display_test/: eigene platformio.ini, eigenes src/ -- damit
; gibt es keine Interferenz mit env:esp32/env:native der Hauptfirmware
; (siehe dortige Historie: "src_dir"/"build_src_filter" liessen sich
; in EINER platformio.ini nicht zuverlaessig auf ein Verzeichnis
; ausserhalb von src/ umbiegen).
;
; Bauen/Flashen (aus diesem Verzeichnis heraus):
;   cd tools/led_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:ledtest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
